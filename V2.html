<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DreamByte Universe V2</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
}

#ui{

    position:fixed;

    top:10px;
    left:10px;

    width:min(330px,92vw);

    max-height:92vh;

    overflow:auto;

    background:rgba(0,0,0,0.72);

    color:white;

    padding:14px;

    border-radius:18px;

    backdrop-filter:blur(10px);

    z-index:10;
}

button,
select,
input{

    width:100%;

    margin-top:8px;

    padding:10px;

    border:none;

    border-radius:12px;

    font-size:15px;
}

button{
    cursor:pointer;
}

#stats{

    position:fixed;

    top:10px;
    right:10px;

    background:rgba(0,0,0,0.6);

    color:white;

    padding:10px;

    border-radius:12px;

    z-index:10;
}

.mobile{

    position:fixed;

    bottom:20px;

    right:20px;

    width:65px;

    height:65px;

    border-radius:50%;

    border:none;

    font-size:28px;

    background:#111;

    color:white;

    z-index:20;
}

.hidden{
    display:none;
}

.small{

    font-size:12px;

    color:#aaa;

    margin-top:10px;
}

</style>
</head>
<body>

<div id="ui">

<h2>🌌 Universe Simulator V2</h2>

<select id="type">

<option value="planet">🌍 Planeta</option>
<option value="star">☀️ Estrella</option>
<option value="blackhole">🕳️ Agujero negro</option>
<option value="gas">🪐 Gigante gaseoso</option>
<option value="ice">🧊 Planeta helado</option>
<option value="lava">🌋 Lava</option>
<option value="secret">🤫 ???</option>

</select>

<label>Masa</label>

<input type="range"
id="mass"
min="10"
max="100000"
value="500">

<label>Tiempo</label>

<input type="range"
id="timeScale"
min="0.1"
max="10"
step="0.1"
value="1">

<button onclick="placeMode=true">
📍 Colocar objeto
</button>

<button onclick="spawnSolar()">
☀️ Sistema Solar
</button>

<button onclick="spawnChaos()">
☢️ Caos
</button>

<button onclick="spawnBlackHoles()">
🕳️ Guerra de agujeros negros
</button>

<button onclick="clearWorld()">
🧹 Limpiar
</button>

<div class="small">

🌌 N-body simulation<br>
✨ Trails orbitales<br>
☄️ Explosiones físicas<br>
🕳️ Agujeros negros absorben<br>
🤫 Hay algo escondido en el vacío...

</div>

</div>

<div id="stats">

🌌 Objetos:
<span id="count">0</span><br>

⚡ Tiempo:
<span id="timeText">1x</span>

</div>

<button class="mobile"
onclick="toggleUI()">☰</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

// =====================
// ESCENA
// =====================

const scene=
new THREE.Scene();

scene.fog=
new THREE.FogExp2(
    0x000000,
    0.00008
);

const camera=
new THREE.PerspectiveCamera(

    75,

    innerWidth/innerHeight,

    0.1,

    1000000
);

camera.position.set(0,400,1200);

const renderer=
new THREE.WebGLRenderer({

    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    devicePixelRatio
);

document.body.appendChild(
    renderer.domElement
);

// =====================
// CONTROLES
// =====================

const controls=
new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping=true;

// =====================
// LUCES
// =====================

const ambient=
new THREE.AmbientLight(
    0xffffff,
    0.35
);

scene.add(ambient);

const sunLight=
new THREE.PointLight(
    0xffffff,
    2,
    0
);

scene.add(sunLight);

// =====================
// ESTRELLAS
// =====================

const starsGeo=
new THREE.BufferGeometry();

const starVertices=[];

for(let i=0;i<25000;i++){

    starVertices.push(

        (Math.random()-0.5)*120000,

        (Math.random()-0.5)*120000,

        (Math.random()-0.5)*120000
    );
}

starsGeo.setAttribute(

    "position",

    new THREE.Float32BufferAttribute(
        starVertices,
        3
    )
);

const starsMat=
new THREE.PointsMaterial({

    color:0xffffff,

    size:1.7
});

const stars=
new THREE.Points(
    starsGeo,
    starsMat
);

scene.add(stars);

// =====================
// OBJETOS
// =====================

const G=0.002;

let bodies=[];

let particles=[];

class Body{

    constructor(
        x,y,z,
        mass,
        vx,vy,vz,
        type
    ){

        this.mass=mass;

        this.type=type;

        this.radius=
        Math.max(
            3,
            Math.cbrt(mass)*2
        );

        this.velocity=
        new THREE.Vector3(
            vx,vy,vz
        );

        this.trail=[];

        this.mesh=
        this.createMesh();

        this.mesh.position.set(
            x,y,z
        );

        scene.add(this.mesh);
    }

    createMesh(){

        const geometry=
        new THREE.SphereGeometry(
            this.radius,
            32,
            32
        );

        let material;

        if(this.type==="planet"){

            material=
            new THREE.MeshPhysicalMaterial({

                color:0x3399ff,

                roughness:1
            });
        }

        else if(this.type==="gas"){

            material=
            new THREE.MeshPhysicalMaterial({

                color:0xd8b06a,

                clearcoat:1
            });
        }

        else if(this.type==="ice"){

            material=
            new THREE.MeshPhysicalMaterial({

                color:0xbdeeff,

                transmission:0.5
            });
        }

        else if(this.type==="lava"){

            material=
            new THREE.MeshPhysicalMaterial({

                color:0xff4400,

                emissive:0xff2200,

                emissiveIntensity:2
            });
        }

        else if(this.type==="star"){

            material=
            new THREE.MeshBasicMaterial({

                color:0xffcc55
            });
        }

        else if(this.type==="blackhole"){

            material=
            new THREE.MeshBasicMaterial({

                color:0x000000
            });
        }

        // PLANETA SECRETO
        else if(this.type==="secret"){

            material=
            new THREE.MeshPhysicalMaterial({

                color:0x220022,

                emissive:0xff0000,

                emissiveIntensity:4
            });

            // OJOS
            const eye1=
            new THREE.PointLight(
                0xff0000,
                4,
                250
            );

            eye1.position.set(
                -this.radius/2,
                this.radius/4,
                this.radius
            );

            const eye2=
            new THREE.PointLight(
                0xff0000,
                4,
                250
            );

            eye2.position.set(
                this.radius/2,
                this.radius/4,
                this.radius
            );

            const group=
            new THREE.Group();

            const mesh=
            new THREE.Mesh(
                geometry,
                material
            );

            group.add(mesh);
            group.add(eye1);
            group.add(eye2);

            return group;
        }

        return new THREE.Mesh(
            geometry,
            material
        );
    }

    update(dt){

        this.mesh.position.add(
            this.velocity.clone()
            .multiplyScalar(dt)
        );

        // ROTACIÓN
        this.mesh.rotation.y+=0.003;

        // TRAILS
        this.trail.push(
            this.mesh.position.clone()
        );

        if(this.trail.length>50){

            this.trail.shift();
        }

        this.drawTrail();
    }

    drawTrail(){

        if(this.line){

            scene.remove(this.line);
        }

        const geo=
        new THREE.BufferGeometry()
        .setFromPoints(this.trail);

        const mat=
        new THREE.LineBasicMaterial({

            color:0xffffff,

            transparent:true,

            opacity:0.35
        });

        this.line=
        new THREE.Line(
            geo,
            mat
        );

        scene.add(this.line);
    }
}

// =====================
// PARTÍCULAS
// =====================

function explosion(pos,size){

    for(let i=0;i<30*size;i++){

        const geo=
        new THREE.SphereGeometry(
            2,
            4,
            4
        );

        const mat=
        new THREE.MeshBasicMaterial({

            color:0xff6600
        });

        const mesh=
        new THREE.Mesh(
            geo,
            mat
        );

        mesh.position.copy(pos);

        scene.add(mesh);

        particles.push({

            mesh,

            velocity:
            new THREE.Vector3(

                (Math.random()-0.5)*8,

                (Math.random()-0.5)*8,

                (Math.random()-0.5)*8
            ),

            life:1
        });
    }
}

// =====================
// FÍSICAS
// =====================

function physics(dt){

    for(let i=0;i<bodies.length;i++){

        const a=bodies[i];

        for(let j=i+1;j<bodies.length;j++){

            const b=bodies[j];

            const dx=
            b.mesh.position.x
            -a.mesh.position.x;

            const dy=
            b.mesh.position.y
            -a.mesh.position.y;

            const dz=
            b.mesh.position.z
            -a.mesh.position.z;

            const dist=
            Math.sqrt(
                dx*dx+
                dy*dy+
                dz*dz
            );

            if(dist<1) continue;

            let force=
            G*(a.mass*b.mass)
            /(dist*dist);

            // BLACK HOLE BOOST
            if(
                a.type==="blackhole"
                ||
                b.type==="blackhole"
            ){

                force*=4;
            }

            const fx=
            force*dx/dist;

            const fy=
            force*dy/dist;

            const fz=
            force*dz/dist;

            a.velocity.x+=fx/a.mass*dt;
            a.velocity.y+=fy/a.mass*dt;
            a.velocity.z+=fz/a.mass*dt;

            b.velocity.x-=fx/b.mass*dt;
            b.velocity.y-=fy/b.mass*dt;
            b.velocity.z-=fz/b.mass*dt;

            // COLISIONES
            if(
                dist<
                (a.radius+b.radius)
            ){

                explosion(
                    a.mesh.position,
                    2
                );

                if(a.mass>b.mass){

                    a.mass+=b.mass;

                    scene.remove(b.mesh);

                    if(b.line)
                    scene.remove(b.line);

                    bodies.splice(j,1);

                    j--;

                }else{

                    b.mass+=a.mass;

                    scene.remove(a.mesh);

                    if(a.line)
                    scene.remove(a.line);

                    bodies.splice(i,1);

                    i--;

                    break;
                }
            }
        }
    }

    for(let body of bodies){

        body.update(dt);
    }

    // PARTÍCULAS
    for(let i=0;i<particles.length;i++){

        const p=particles[i];

        p.mesh.position.add(
            p.velocity
        );

        p.life-=0.02;

        p.mesh.material.opacity=
        p.life;

        p.mesh.material.transparent=
        true;

        if(p.life<=0){

            scene.remove(p.mesh);

            particles.splice(i,1);

            i--;
        }
    }
}

// =====================
// LOOP
// =====================

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
    parseFloat(
        document.getElementById(
            "timeScale"
        ).value
    );

    document.getElementById(
        "timeText"
    ).textContent=
    dt.toFixed(1)+"x";

    physics(dt);

    controls.update();

    renderer.render(
        scene,
        camera
    );

    document.getElementById(
        "count"
    ).textContent=
    bodies.length;
}

animate();

// =====================
// COLOCAR OBJETOS
// =====================

let placeMode=false;

renderer.domElement
.addEventListener(

"click",

(e)=>{

    if(!placeMode) return;

    placeMode=false;

    const mouse=
    new THREE.Vector2(

        (e.clientX/innerWidth)*2-1,

        -(e.clientY/innerHeight)*2+1
    );

    const raycaster=
    new THREE.Raycaster();

    raycaster.setFromCamera(
        mouse,
        camera
    );

    const pos=
    raycaster.ray.origin.clone()
    .add(
        raycaster.ray.direction
        .multiplyScalar(900)
    );

    const type=
    document.getElementById(
        "type"
    ).value;

    const mass=
    parseFloat(
        document.getElementById(
            "mass"
        ).value
    );

    bodies.push(

        new Body(

            pos.x,
            pos.y,
            pos.z,

            mass,

            (Math.random()-0.5)*0.7,

            (Math.random()-0.5)*0.7,

            (Math.random()-0.5)*0.7,

            type
        )
    );
});

// =====================
// SISTEMA SOLAR
// =====================

function spawnSolar(){

    clearWorld();

    bodies.push(

        new Body(

            0,0,0,

            80000,

            0,0,0,

            "star"
        )
    );

    bodies.push(

        new Body(

            450,0,0,

            200,

            0,0,6,

            "planet"
        )
    );

    bodies.push(

        new Body(

            800,0,0,

            100,

            0,0,4.7,

            "planet"
        )
    );

    bodies.push(

        new Body(

            -1500,0,0,

            2500,

            0,0,-2,

            "secret"
        )
    );
}

// =====================
// CAOS
// =====================

function spawnChaos(){

    clearWorld();

    const types=[

        "planet",
        "star",
        "blackhole",
        "gas",
        "lava",
        "ice",
        "secret"
    ];

    for(let i=0;i<150;i++){

        const t=
        types[
        Math.floor(
        Math.random()*types.length
        )];

        bodies.push(

            new Body(

                (Math.random()-0.5)*12000,

                (Math.random()-0.5)*12000,

                (Math.random()-0.5)*12000,

                Math.random()*50000+10,

                (Math.random()-0.5)*2,

                (Math.random()-0.5)*2,

                (Math.random()-0.5)*2,

                t
            )
        );
    }
}

// =====================
// BLACK HOLES
// =====================

function spawnBlackHoles(){

    clearWorld();

    for(let i=0;i<6;i++){

        bodies.push(

            new Body(

                (Math.random()-0.5)*6000,

                (Math.random()-0.5)*6000,

                (Math.random()-0.5)*6000,

                90000,

                (Math.random()-0.5)*1.5,

                (Math.random()-0.5)*1.5,

                (Math.random()-0.5)*1.5,

                "blackhole"
            )
        );
    }
}

// =====================
// LIMPIAR
// =====================

function clearWorld(){

    for(let body of bodies){

        scene.remove(body.mesh);

        if(body.line)
        scene.remove(body.line);
    }

    bodies=[];

    for(let p of particles){

        scene.remove(p.mesh);
    }

    particles=[];
}

// =====================
// RESPONSIVE
// =====================

addEventListener(

"resize",

()=>{

    camera.aspect=
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});

// =====================
// UI
// =====================

function toggleUI(){

    document.getElementById(
        "ui"
    ).classList.toggle("hidden");
}

</script>
</body>
</html>
