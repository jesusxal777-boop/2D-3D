<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>DreamByte Universe Simulator</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
    background:
    radial-gradient(circle at center,#060616,#000);
}

#ui{

    position:fixed;

    top:10px;
    left:10px;

    width:min(330px,90vw);

    max-height:92vh;

    overflow:auto;

    background:rgba(0,0,0,0.72);

    color:white;

    border-radius:18px;

    padding:14px;

    backdrop-filter:blur(12px);

    z-index:5;
}

button,
select,
input{

    width:100%;

    margin-top:7px;

    border:none;

    border-radius:12px;

    padding:11px;

    font-size:16px;
}

button{
    cursor:pointer;
}

#info{

    position:fixed;

    top:10px;
    right:10px;

    background:rgba(0,0,0,0.6);

    color:white;

    padding:10px;

    border-radius:12px;

    font-size:13px;

    backdrop-filter:blur(10px);

    z-index:4;
}

.small{

    font-size:12px;

    color:#aaa;

    margin-top:10px;
}

.hidden{
    display:none;
}

.mobile{

    position:fixed;

    bottom:20px;

    right:20px;

    width:65px;

    height:65px;

    border-radius:50%;

    border:none;

    font-size:28px;

    background:#111;

    color:white;

    z-index:20;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="info">
🌌 Objetos: <span id="count">0</span><br>
🔭 Zoom: <span id="zoom">1x</span>
</div>

<button class="mobile" onclick="toggleUI()">☰</button>

<div id="ui">

<h2>🌌 Universe Simulator</h2>

<label>Objeto</label>

<select id="preset">

<option value="earth">🌍 Tierra</option>
<option value="mars">🔴 Marte</option>
<option value="gas">🪐 Gigante gaseoso</option>
<option value="ice">🧊 Helado</option>
<option value="lava">🌋 Lava</option>
<option value="star">☀️ Estrella</option>
<option value="blackhole">🕳️ Agujero negro</option>
<option value="asteroid">☄️ Asteroide</option>
<option value="comet">🌠 Cometa</option>
<option value="ufo">🛸 OVNI</option>
<option value="duck">🦆 Pato</option>
<option value="flipflop">🩴 Chancla</option>
<option value="secret">🤫 ???</option>
<option value="custom">⚙️ Custom</option>

</select>

<label>Masa</label>
<input type="range"
id="mass"
min="1"
max="200000"
value="200">

<label>Velocidad X</label>
<input type="range"
id="vx"
min="-20"
max="20"
value="0">

<label>Velocidad Y</label>
<input type="range"
id="vy"
min="-20"
max="20"
value="0">

<button onclick="enablePlacement()">
📍 Colocar objeto
</button>

<button onclick="spawnSolar()">
☀️ Sistema Solar
</button>

<button onclick="spawnGalaxies()">
🌌 Vía Láctea vs Andrómeda
</button>

<button onclick="spawnChaos()">
☢️ Caos Universal
</button>

<button onclick="clearWorld()">
🧹 Limpiar
</button>

<div class="small">

📱 Compatible con móvil/tablet/PC<br>
🤏 Zoom con dedos o rueda<br>
🖱️ Arrastra objetos<br>
☄️ Hay colisiones y explosiones<br>
🌍 Las órbitas son dinámicas<br>
🤫 Existe un planeta secreto...

</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){

    canvas.width=innerWidth;
    canvas.height=innerHeight;
}

resize();

window.addEventListener("resize",resize);

const G=0.03;

let bodies=[];
let particles=[];

let placing=false;

let camera={

    x:0,
    y:0,
    zoom:1
};

class Body{

    constructor(x,y,mass,vx,vy,type,color){

        this.x=x;
        this.y=y;

        this.mass=mass;

        this.vx=vx;
        this.vy=vy;

        this.type=type;

        this.radius=Math.max(4,Math.cbrt(mass));

        this.color=color || "white";

        this.angle=0;
    }

    draw(){

        let sx=(this.x-camera.x)
        *camera.zoom
        +canvas.width/2;

        let sy=(this.y-camera.y)
        *camera.zoom
        +canvas.height/2;

        let r=this.radius*camera.zoom;

        ctx.save();

        ctx.translate(sx,sy);

        this.angle+=0.01;

        if(this.type==="earth"){

            ctx.fillStyle="#3fa9ff";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();

            ctx.fillStyle="#37d46f";

            ctx.fillRect(-r/2,-r/4,r/2,r/3);
        }

        else if(this.type==="mars"){

            ctx.fillStyle="#d24c31";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        else if(this.type==="gas"){

            ctx.fillStyle="#d8bb79";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();

            ctx.strokeStyle="#ffffff88";

            ctx.beginPath();

            ctx.arc(0,0,r*1.5,0,Math.PI*2);

            ctx.stroke();
        }

        else if(this.type==="ice"){

            ctx.fillStyle="#bdeeff";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        else if(this.type==="lava"){

            ctx.fillStyle="#ff5500";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        else if(this.type==="star"){

            let grad=ctx.createRadialGradient(
                0,0,1,
                0,0,r*2
            );

            grad.addColorStop(0,"#fff9aa");
            grad.addColorStop(1,"#ff9900");

            ctx.fillStyle=grad;

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        else if(this.type==="blackhole"){

            ctx.fillStyle="black";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();

            ctx.strokeStyle="#a200ff";

            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.arc(0,0,r*1.6,0,Math.PI*2);

            ctx.stroke();
        }

        else if(this.type==="asteroid"){

            ctx.fillStyle="#888";

            ctx.beginPath();

            for(let i=0;i<8;i++){

                let ang=(Math.PI*2/8)*i;

                let rr=r+Math.random()*4;

                ctx.lineTo(
                    Math.cos(ang)*rr,
                    Math.sin(ang)*rr
                );
            }

            ctx.fill();
        }

        else if(this.type==="comet"){

            ctx.strokeStyle="#88ccff";

            ctx.beginPath();

            ctx.moveTo(-r*3,0);

            ctx.lineTo(0,0);

            ctx.stroke();

            ctx.fillStyle="white";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        else if(this.type==="ufo"){

            ctx.font=`${r*2}px serif`;

            ctx.fillText("🛸",-r,r);
        }

        else if(this.type==="duck"){

            ctx.font=`${r*2}px serif`;

            ctx.fillText("🦆",-r,r);
        }

        else if(this.type==="flipflop"){

            ctx.font=`${r*2}px serif`;

            ctx.fillText("🩴",-r,r);
        }

        // PLANETA SECRETO
        else if(this.type==="secret"){

            ctx.fillStyle="#110011";

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();

            ctx.strokeStyle="red";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(0,0,r*1.3,0,Math.PI*2);

            ctx.stroke();

            // OJOS
            ctx.fillStyle="red";

            ctx.beginPath();
            ctx.arc(-r/3,-r/6,r/8,0,Math.PI*2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(r/3,-r/6,r/8,0,Math.PI*2);
            ctx.fill();

            // BOCA
            ctx.strokeStyle="red";

            ctx.beginPath();

            ctx.arc(0,r/5,r/3,0,Math.PI);

            ctx.stroke();

            // EFECTO
            for(let i=0;i<3;i++){

                ctx.strokeStyle=
                `rgba(255,0,0,0.2)`;

                ctx.beginPath();

                ctx.arc(
                    0,0,
                    r*1.6+(Math.sin(this.angle+i)*10),
                    0,
                    Math.PI*2
                );

                ctx.stroke();
            }
        }

        else if(this.type==="custom"){

            ctx.fillStyle=this.color;

            ctx.beginPath();

            ctx.arc(0,0,r,0,Math.PI*2);

            ctx.fill();
        }

        ctx.restore();
    }

    update(dt){

        this.x+=this.vx*dt;
        this.y+=this.vy*dt;
    }
}

function physics(dt){

    for(let i=0;i<bodies.length;i++){

        let a=bodies[i];

        for(let j=i+1;j<bodies.length;j++){

            let b=bodies[j];

            let dx=b.x-a.x;
            let dy=b.y-a.y;

            let dist=Math.sqrt(dx*dx+dy*dy);

            if(dist<1) continue;

            let force=
            G*(a.mass*b.mass)/(dist*dist);

            let ax=
            force*dx/dist/a.mass;

            let ay=
            force*dy/dist/a.mass;

            let bx=
            -force*dx/dist/b.mass;

            let by=
            -force*dy/dist/b.mass;

            a.vx+=ax*dt;
            a.vy+=ay*dt;

            b.vx+=bx*dt;
            b.vy+=by*dt;

            // COLISIONES
            if(dist<(a.radius+b.radius)*0.7){

                explosion(
                    (a.x+b.x)/2,
                    (a.y+b.y)/2
                );

                if(a.mass>b.mass){

                    a.mass+=b.mass*0.7;

                    a.radius=Math.cbrt(a.mass);

                    bodies.splice(j,1);

                    j--;

                }else{

                    b.mass+=a.mass*0.7;

                    b.radius=Math.cbrt(b.mass);

                    bodies.splice(i,1);

                    i--;

                    break;
                }
            }
        }
    }

    for(let body of bodies){

        body.update(dt);
    }
}

function explosion(x,y){

    for(let i=0;i<25;i++){

        particles.push({

            x,y,

            vx:(Math.random()-0.5)*10,

            vy:(Math.random()-0.5)*10,

            life:1
        });
    }
}

function drawParticles(){

    for(let i=0;i<particles.length;i++){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life-=0.02;

        let sx=
        (p.x-camera.x)*camera.zoom
        +canvas.width/2;

        let sy=
        (p.y-camera.y)*camera.zoom
        +canvas.height/2;

        ctx.fillStyle=
        `rgba(255,120,0,${p.life})`;

        ctx.fillRect(sx,sy,3,3);

        if(p.life<=0){

            particles.splice(i,1);

            i--;
        }
    }
}

function stars(){

    for(let i=0;i<400;i++){

        let x=(i*777)%canvas.width;

        let y=(i*999)%canvas.height;

        ctx.fillStyle="white";

        ctx.fillRect(x,y,1,1);
    }
}

function animate(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    stars();

    physics(1);

    drawParticles();

    for(let body of bodies){

        body.draw();
    }

    document.getElementById("count")
    .textContent=bodies.length;

    document.getElementById("zoom")
    .textContent=
    camera.zoom.toFixed(2)+"x";

    requestAnimationFrame(animate);
}

animate();

function enablePlacement(){

    placing=true;

    alert(
    "Toca/click en el espacio para colocar el objeto."
    );
}

canvas.addEventListener("pointerdown",(e)=>{

    let wx=
    (e.clientX-canvas.width/2)
    /camera.zoom
    +camera.x;

    let wy=
    (e.clientY-canvas.height/2)
    /camera.zoom
    +camera.y;

    // COLOCAR OBJETO
    if(placing){

        placing=false;

        let type=
        document.getElementById("preset").value;

        let mass=
        parseFloat(
            document.getElementById("mass").value
        );

        let vx=
        parseFloat(
            document.getElementById("vx").value
        );

        let vy=
        parseFloat(
            document.getElementById("vy").value
        );

        let color="white";

        // CUSTOM
        if(type==="custom"){

            color=
            prompt(
                "Color CSS del planeta:",
                "#00ffff"
            ) || "#00ffff";

            let customMass=
            prompt(
                "Masa personalizada:",
                mass
            );

            if(customMass){

                mass=parseFloat(customMass);
            }
        }

        bodies.push(

            new Body(
                wx,
                wy,
                mass,
                vx,
                vy,
                type,
                color
            )
        );

        return;
    }

    // ARRASTRAR OBJETOS
    for(let body of bodies){

        let sx=
        (body.x-camera.x)
        *camera.zoom
        +canvas.width/2;

        let sy=
        (body.y-camera.y)
        *camera.zoom
        +canvas.height/2;

        let dist=
        Math.hypot(
            e.clientX-sx,
            e.clientY-sy
        );

        if(dist<body.radius*camera.zoom+10){

            draggingObject=body;

            return;
        }
    }

    draggingCamera=true;

    lastX=e.clientX;
    lastY=e.clientY;
});

let draggingObject=null;

let draggingCamera=false;

let lastX=0;
let lastY=0;

canvas.addEventListener("pointermove",(e)=>{

    let dx=e.clientX-lastX;
    let dy=e.clientY-lastY;

    if(draggingObject){

        draggingObject.x+=dx/camera.zoom;
        draggingObject.y+=dy/camera.zoom;
    }

    if(draggingCamera){

        camera.x-=dx/camera.zoom;
        camera.y-=dy/camera.zoom;
    }

    lastX=e.clientX;
    lastY=e.clientY;
});

canvas.addEventListener("pointerup",()=>{

    draggingObject=null;

    draggingCamera=false;
});

// ZOOM PC
canvas.addEventListener("wheel",(e)=>{

    e.preventDefault();

    if(e.deltaY<0){

        camera.zoom*=1.1;

    }else{

        camera.zoom/=1.1;
    }

    camera.zoom=
    Math.max(0.02,
    Math.min(50,camera.zoom));
});

// PINCH ZOOM
let lastDistance=null;

canvas.addEventListener("touchmove",(e)=>{

    if(e.touches.length===2){

        let dx=
        e.touches[0].clientX
        -e.touches[1].clientX;

        let dy=
        e.touches[0].clientY
        -e.touches[1].clientY;

        let dist=Math.sqrt(dx*dx+dy*dy);

        if(lastDistance){

            if(dist>lastDistance){

                camera.zoom*=1.02;

            }else{

                camera.zoom/=1.02;
            }

            camera.zoom=
            Math.max(0.02,
            Math.min(50,camera.zoom));
        }

        lastDistance=dist;
    }
});

canvas.addEventListener("touchend",()=>{

    lastDistance=null;
});

function clearWorld(){

    bodies=[];
    particles=[];
}

function spawnSolar(){

    clearWorld();

    let sun=
    new Body(
        0,0,
        100000,
        0,0,
        "star"
    );

    bodies.push(sun);

    // ÓRBITAS
    bodies.push(
        new Body(
            400,0,
            100,
            0,8,
            "earth"
        )
    );

    bodies.push(
        new Body(
            700,0,
            80,
            0,6,
            "mars"
        )
    );

    bodies.push(
        new Body(
            1200,0,
            700,
            0,4,
            "gas"
        )
    );
}

function spawnGalaxies(){

    clearWorld();

    bodies.push(
        new Body(
            -3000,
            0,
            90000,
            0,2,
            "blackhole"
        )
    );

    bodies.push(
        new Body(
            3000,
            0,
            90000,
            0,-2,
            "blackhole"
        )
    );

    for(let i=0;i<50;i++){

        bodies.push(

            new Body(

                -3000+
                Math.random()*1000,

                (Math.random()-0.5)*1200,

                Math.random()*300+10,

                0,
                4+Math.random(),

                "star"
            )
        );

        bodies.push(

            new Body(

                3000+
                Math.random()*1000,

                (Math.random()-0.5)*1200,

                Math.random()*300+10,

                0,
                -4-Math.random(),

                "star"
            )
        );
    }
}

function spawnChaos(){

    clearWorld();

    let types=[

        "earth",
        "mars",
        "gas",
        "lava",
        "ice",
        "blackhole",
        "star",
        "asteroid",
        "duck",
        "ufo",
        "flipflop",
        "secret"
    ];

    for(let i=0;i<120;i++){

        let t=
        types[
        Math.floor(
        Math.random()*types.length
        )];

        bodies.push(

            new Body(

                (Math.random()-0.5)*10000,

                (Math.random()-0.5)*10000,

                Math.random()*30000+20,

                (Math.random()-0.5)*8,

                (Math.random()-0.5)*8,

                t
            )
        );
    }
}

function toggleUI(){

    document.getElementById("ui")
    .classList.toggle("hidden");
}

</script>
</body>
</html>
